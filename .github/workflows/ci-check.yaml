name: 'check'
on:
  pull_request:
    branches: [main, release, 'releases/**']
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-check-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  flake8:
    name: check-flake8
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/flake8-check.yaml@main
    with:
      python-version: '3.14'
      packages: 'setuptools<82 flake8 flake8-import-order flake8-commas flake8-logging-format flake8-quotes'

  tests:
    name: check-tests
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/django-test-check.yaml@main
    with:
      python-version: '3.14'
      requirements: requirements.txt
      settings-file: .ci.settings.py
      settings-target: tloq/local_settings.py
      database: postgres
      postgres-image: postgres:17
      labels: quiz

  migrations:
    name: check-migrations
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/django-migration-check.yaml@main
    with:
      python-version: '3.14'
      requirements: requirements.txt
      settings-file: .ci.settings.py
      settings-target: tloq/local_settings.py
      database: postgres
      postgres-image: postgres:17

  templates:
    name: check-templates
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/django-template-check.yaml@main
    with:
      python-version: '3.14'
      requirements: requirements.txt
      settings-file: .ci.settings.py
      settings-target: tloq/local_settings.py

  workflows:
    name: check-workflows
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/workflow-lint.yaml@main

  docker:
    name: check-docker
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/docker-build-check.yaml@main
    with:
      images: >-
        [{"image": "online-quiz-site", "dockerfile": "Dockerfile"}]

  dependencies:
    name: check-dependencies
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/python-audit.yaml@main
    with:
      python-version: '3.14'
      requirements: requirements.txt
