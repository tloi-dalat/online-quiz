name: 'workflow'
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: workflow-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    permissions:
      contents: read
      packages: write
    uses: tloi-dalat/reusable-workflow/.github/workflows/build-push.yaml@main
    with:
      image: online-quiz-site
      dockerfile: Dockerfile
      push: ${{ github.event_name != 'pull_request' }}

  deploy-dev:
    if: github.ref == 'refs/heads/main'
    needs: [site]
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/dispatch.yaml@main
    with:
      apps: site
      namespace: online-quiz
      environment: development
      version: ${{ needs.site.outputs.version }}
    secrets: inherit
